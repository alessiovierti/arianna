<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Arianna Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#overview" aria-label="Arianna overview"><span class="brand-wordmark">Arianna</span><span class="brand-version">v0.1</span></a>
      <form id="global-search" class="global-search" role="search">
        <label class="sr-only" for="global-query">Search repository knowledge</label>
        <input id="global-query" placeholder="Search repository knowledge" autocomplete="off">
        <span class="search-hint">/</span>
      </form>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="#overview" data-nav="overview">Overview</a>
        <a href="#search" data-nav="search">Search</a>
        <a href="#docs" data-nav="docs">Documentation</a>
        <a href="#impact?mode=working-tree" data-nav="impact">Change impact</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-secondary btn-small" data-index="baseline">Index</button>
        <button class="btn btn-secondary btn-small" data-index="working-tree">Working tree</button>
        <label class="theme-control"><span class="sr-only">Theme</span><select id="theme-select" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      </div>
    </div>
  </header>
  <div id="snapshot-banner" class="snapshot-banner hidden" role="status" aria-live="polite">
    <strong>Read-only snapshot</strong>
    <span>This view contains a frozen analysis. Repository actions, source previews and change analysis are unavailable.</span>
  </div>
  <main class="container">
    <div id="error" class="flash flash-error hidden" role="alert"></div>
    <div id="job-status" class="job-status hidden" aria-live="polite"></div>
    <section id="overview" class="view"></section>
    <section id="search" class="view hidden"></section>
    <section id="docs" class="view hidden"></section>
    <section id="impact" class="view hidden"></section>
    <section id="detail" class="view hidden"></section>
    <section id="source" class="view hidden"></section>
  </main>
  <script src="/vendor/markdown-it.min.js?v=14.3.0"></script>
  <script src="/vendor/mermaid.min.js?v=10.9.1"></script>
  <script src="/app.js?v=architecture-20260816-2"></script>
  <script>
    fetch('/api/repository').then(response => response.json()).then(repository => {
      if (repository.snapshot) {
        document.body.classList.add('snapshot-mode');
        document.querySelector('#snapshot-banner')?.classList.remove('hidden');
        const disableRepositoryActions = () => document.querySelectorAll('[data-index], [data-action="refactoring"], [data-action="verification"], a[href^="#impact"]').forEach(element => {
          if (element.tagName === 'BUTTON') element.disabled = true;
          element.classList.add('action-disabled');
          element.setAttribute('aria-disabled', 'true');
          if (element.tagName === 'A') element.tabIndex = -1;
        });
        disableRepositoryActions();
        new MutationObserver(disableRepositoryActions).observe(document.body, {childList: true, subtree: true});
        document.addEventListener('click', event => {
          if (event.target.closest('.action-disabled')) event.preventDefault();
        }, true);
      }
    }).catch(() => {});
  </script>
</body>
</html>
